        join:
          joinCondition: |-
            FROM {{ ref('POC_BRONZE', 'TR1__ASSOCIATED_QUALIFICATION__C') }} TR1__ASSOCIATED_QUALIFICATION__C
            LEFT JOIN {{ ref('POC_BRONZE', 'LICENSE_REQUEST__C') }} LICENSE_REQUEST__C 
                ON LICENSE_REQUEST__C."Id" = TR1__ASSOCIATED_QUALIFICATION__C."License_Request__c"
            LEFT JOIN {{ ref('POC_BRONZE', 'RECORDTYPE') }} RECORDTYPE 
                ON RECORDTYPE."Id" = TR1__ASSOCIATED_QUALIFICATION__C."RecordTypeId"
            INNER JOIN {{ ref('POC_BRONZE', 'STATE_ABBRV') }} STATE_ABBRV 
                ON TR1__ASSOCIATED_QUALIFICATION__C."Licenses_in__c" = STATE_ABBRV.NAME
            LEFT JOIN {{ ref('POC_BRONZE', 'TR1__CLOSING_REPORT__C') }} TR1__CLOSING_REPORT__C 
                ON TR1__CLOSING_REPORT__C."Id" = TR1__ASSOCIATED_QUALIFICATION__C."Closing_Report__c"
            WHERE
                TR1__ASSOCIATED_QUALIFICATION__C."IsDeleted" = FALSE 
                AND RECORDTYPE."Name" = 'License' 
                AND TR1__ASSOCIATED_QUALIFICATION__C."Licenses_in__c" IS NOT NULL 
                AND (TR1__ASSOCIATED_QUALIFICATION__C."Type__c" IN ('Full Physician License','IMLC','SPL (State of Primary Licensure)', 'CSR')
                     OR (TR1__ASSOCIATED_QUALIFICATION__C."Type__c" IN ('Locum/Temp/Emerg') 
                         AND TR1__ASSOCIATED_QUALIFICATION__C."TR1__Status__c" <> 'Inactive'))
