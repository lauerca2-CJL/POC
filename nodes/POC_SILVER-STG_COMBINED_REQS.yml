            nodeName: STG_SHIFT_BASE_TABLE
        join:
          joinCondition: |-
            FROM {{ ref('POC_SILVER', 'STG_SHIFT_BASE_TABLE') }} STG_SHIFT_BASE_TABLE
            LEFT JOIN {{ ref('POC_BRONZE', 'MDDO_STATE_LICENSE_REQUIREMENTS') }} MDDO_STATE_LICENSE_REQUIREMENTS_PHYS
                ON MDDO_STATE_LICENSE_REQUIREMENTS_PHYS.STATE = STG_SHIFT_BASE_TABLE.STATE_ID
                AND MDDO_STATE_LICENSE_REQUIREMENTS_PHYS.FULL_PHYSICIAN = TRUE
            LEFT JOIN {{ ref('POC_BRONZE', 'CSR_STATE_REQUIREMENTS') }} CSR_STATE_REQUIREMENTS
                ON CSR_STATE_REQUIREMENTS.STATE = STG_SHIFT_BASE_TABLE.STATE_ID
                AND CSR_STATE_REQUIREMENTS.CSR_REQUIRED = TRUE
                AND STG_SHIFT_BASE_TABLE._BOOL_GOV = FALSE
                AND STG_SHIFT_BASE_TABLE.CSR_NOT_REQUIRED__C = FALSE
            LEFT JOIN {{ ref('POC_BRONZE', 'CSR_STATE_REQUIREMENTS') }} CSR_STATE_REQUIREMENTS_TELE
                ON CSR_STATE_REQUIREMENTS_TELE.STATE = STG_SHIFT_BASE_TABLE.PRIMARY_STATE
                AND CSR_STATE_REQUIREMENTS_TELE.CSR_REQUIRED = TRUE
                AND STG_SHIFT_BASE_TABLE._BOOL_GOV = FALSE
                AND STG_SHIFT_BASE_TABLE.CSR_NOT_REQUIRED__C = FALSE
                AND STG_SHIFT_BASE_TABLE.TELEMEDICINE__C = TRUE
