          - locationName: POC_SILVER
            nodeName: STG_ALL_STATES_LOOKUP
          - locationName: POC_SILVER
            nodeName: STG_CRF_LOOKUP
        join:
          joinCondition: |-
            FROM {{ ref('POC_BRONZE', 'SIRENUM__SHIFT__C') }} SIRENUM__SHIFT__C
            LEFT JOIN {{ ref('POC_BRONZE', 'TR1__CLOSING_REPORT__C') }} TR1__CLOSING_REPORT__C 
                ON TR1__CLOSING_REPORT__C."Id" = SIRENUM__SHIFT__C."s5m__BH4SFClosingReport__c"
            LEFT JOIN {{ ref('POC_BRONZE', 'ACCOUNT') }} ACCOUNT_FAC 
                ON TR1__CLOSING_REPORT__C."Facility_Name__c" = ACCOUNT_FAC."Id"
            LEFT JOIN {{ ref('POC_BRONZE', 'TR1__JOB__C') }} TR1__JOB__C 
                ON TR1__JOB__C."Id" = SIRENUM__SHIFT__C."s5m__BH4SFJob__c"
            LEFT JOIN {{ ref('POC_BRONZE', 'CONTACT') }} CONTACT 
                ON CONTACT."Id" = TR1__CLOSING_REPORT__C."TR1__Person_Placed__c"
            LEFT JOIN {{ ref('POC_SILVER', 'STG_CRF_LOOKUP') }} STG_CRF_LOOKUP 
                ON SIRENUM__SHIFT__C."Closing_Report_Facility__c" = STG_CRF_LOOKUP.ID
            LEFT JOIN {{ ref('POC_BRONZE', 'STATE_ABBRV') }} STATE_ABBRV_PL 
                ON STATE_ABBRV_PL.NAME = TR1__CLOSING_REPORT__C."Practicing_Location__c"
            LEFT JOIN {{ ref('POC_BRONZE', 'STATE_ABBRV') }} STATE_ABBRV_STATE 
                ON STATE_ABBRV_STATE.NAME = COALESCE(STG_CRF_LOOKUP.CRF_STATE_CODE, ACCOUNT_FAC."BillingState")
            LEFT JOIN {{ ref('POC_SILVER', 'STG_ALL_STATES_LOOKUP') }} STG_ALL_STATES_LOOKUP
                ON STG_ALL_STATES_LOOKUP.CR_ID = SIRENUM__SHIFT__C."s5m__BH4SFClosingReport__c"
                AND SIRENUM__SHIFT__C."Location_Type__c" IN ('TBD Location', 'Multiple Locations')
            WHERE 
                SIRENUM__SHIFT__C."IsDeleted" = FALSE
                AND SIRENUM__SHIFT__C."sirenum__Scheduled_Start_Time__c"::DATE > GETDATE()
                AND SIRENUM__SHIFT__C."Status_Validated_Timestamp__c" IS NOT NULL
                AND SIRENUM__SHIFT__C."Status_Cancelled_Timestamp__c" IS NULL
                AND CONTACT."Candidate_Type__c" IN ('MD (Medical Doctor)','DO (Osteopathic Doctor)')
                AND SIRENUM__SHIFT__C."Reason_for_Cancellation__c" IS NULL
            GROUP BY ALL
